name: Monthly data update

# Keeps the published daily/monthly anomaly data current without a manual run.
# Runs tools/monthly_update.py, which reads what is already published, computes
# only the days added since then (per-pixel-first, METH-007), and re-exports the
# merged whole. See tools/monthly_update.py for the full explanation.
#
# Requires one repository secret: EE_SERVICE_ACCOUNT_KEY, the JSON key for the
# balaton-monthly-update@ee-jtantaroman.iam.gserviceaccount.com service account
# (Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  schedule:
    # 06:00 UTC on the 7th of every month. Measured in this project: MODIS scenes can
    # take 3+ days to clear NASA's processing and land in the collection, so running
    # too early (the 2nd) risks the previous month still being short its last few
    # days. The app itself trims an incomplete month from its picker either way
    # (latestCompleteMonth in app/balaton_anomaly_app.js), so this date only affects
    # how promptly a finished month actually appears, not whether an unfinished one
    # could be shown.
    - cron: '0 6 7 * *'
  workflow_dispatch: {}  # manual "Run workflow" button, for testing or an off-cycle refresh

permissions:
  contents: read
  actions: write  # lets the job disable this same schedule if MODIS data goes stale
                  # for good (tools/monthly_update.py, STAGNANT_DAYS_THRESHOLD)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      - name: Write service account key
        run: echo "$EE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/ee-key.json"
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}

      - name: Run the incremental update
        env:
          EE_SERVICE_ACCOUNT_KEY_FILE: ${{ runner.temp }}/ee-key.json
          EE_SERVICE_ACCOUNT_EMAIL: balaton-monthly-update@ee-jtantaroman.iam.gserviceaccount.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # only used to self-disable if MODIS data goes stale
        run: python tools/monthly_update.py --project ee-jtantaroman
